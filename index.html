<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pull</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --text: #e8e9ee;
    --dim: #6b7080;

    --common: #9aa0ab;
    --uncommon: #4fd17c;
    --rare: #4d9bf0;
    --epic: #b569f0;
    --legendary: #f0b93a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .title {
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .best-rank {
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .best-rank b {
    font-weight: 600;
    transition: color 0.3s ease;
  }

  .card {
    position: relative;
    height: 220px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid #232733;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 28px;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, var(--glow, transparent) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .card.lit::before { opacity: 0.35; }

  .result {
    position: relative;
    z-index: 1;
    padding: 0 20px;
  }

  .result-name {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 8px;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .result-name.show {
    opacity: 1;
    transform: translateY(0);
  }

  .result-rarity {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease 0.05s;
  }

  .result-rarity.show { opacity: 1; }

  .result-rarity.match-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: normal;
    text-transform: none;
  }

  .placeholder {
    color: var(--dim);
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: default; }

  .result-odds {
    font-size: 11px;
    color: var(--dim);
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.3s ease 0.1s;
  }

  .result-odds.show { opacity: 1; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  .card.rolling { animation: shake 0.35s ease-in-out infinite; }
</style>
</head>
<body>

<div class="stage">
  <div class="header-row">
    <div class="title">Leaderboard</div>
    <div class="best-rank" id="bestRank">Best: <b>—</b></div>
  </div>

  <div class="card" id="card">
    <div class="result" id="result">
      <div class="placeholder" id="placeholder">Press the button to pull</div>
    </div>
  </div>

  <button id="pullBtn">Pull</button>
</div>

<!-- Supabase client SDK (only used for the shared leaderboard) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  // ---- Configure your pool here ----
  // "weight" is relative odds: weight 1 vs weight 20 means the weight-1
  // item is 20x rarer. Weights don't need to add to any particular number.
  const pool = [
    { name: "Common",         rarity: "common",    weight: 50, color: "var(--common)" },
    { name: "Uncommon",       rarity: "uncommon",  weight: 25, color: "var(--uncommon)" },
    { name: "Rare Item",      rarity: "rare",      weight: 20, color: "var(--rare)" },
    { name: "Epic Item",      rarity: "epic",      weight: 4,  color: "var(--epic)" },
    { name: "Legendary Item", rarity: "legendary", weight: 1,  color: "var(--legendary)" },
  ];
  // -----------------------------------

  const card = document.getElementById("card");
  const result = document.getElementById("result");
  const btn = document.getElementById("pullBtn");
  const bestRankEl = document.getElementById("bestRank");

  const totalWeight = pool.reduce((sum, item) => sum + item.weight, 0);

  // Rank order = position in the pool array (last = rarest/best)
  let bestIndex = -1;

  function showBest(index, name, color) {
    bestIndex = index;
    bestRankEl.innerHTML = `Best: <b style="color:${color}">${name}</b>`;
  }

  function oddsLabel(item) {
    const oneInN = (totalWeight / item.weight).toFixed(1).replace(/\.0$/, "");
    return `1 in ${oneInN}`;
  }

  function pickItem() {
    let roll = Math.random() * totalWeight;
    for (const item of pool) {
      if (roll < item.weight) return item;
      roll -= item.weight;
    }
    return pool[pool.length - 1]; // fallback, shouldn't hit
  }

  function pull() {
    btn.disabled = true;
    card.classList.add("rolling");
    card.classList.remove("lit");
    result.innerHTML = `<div class="placeholder">Rolling…</div>`;

    setTimeout(() => {
      const item = pickItem();
      const index = pool.indexOf(item);

      if (index > bestIndex) {
        showBest(index, item.name, item.color);
        if (window.reportBestToLeaderboard) window.reportBestToLeaderboard(item, index);
      }

      card.classList.remove("rolling");
      card.style.setProperty("--glow", item.color);
      card.classList.add("lit");

      result.innerHTML = `
        <div class="result-name" id="resultName" style="color:${item.color}">${item.name}</div>
        <div class="result-odds" id="resultOdds">${oddsLabel(item)}</div>
      `;

      requestAnimationFrame(() => {
        document.getElementById("resultName").classList.add("show");
        document.getElementById("resultOdds").classList.add("show");
      });

      btn.disabled = false;
    }, 600);
  }

  // Core gameplay is wired up now, unconditionally — the button works
  // even if the Supabase block below never runs.
  btn.addEventListener("click", pull);

  // ---- Shared leaderboard (Supabase) ----
  // Paste your project values here — Supabase dashboard → Project Settings → API
  const SUPABASE_URL = "https://ezryjvozdmgcliluyssn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_3-7H5Hw-yNUaeKdB-VdmFw_ZoqXziae";

  (function setupLeaderboard() {
    try {
      if (!window.supabase || SUPABASE_URL.startsWith("YOUR_")) {
        console.warn("Supabase not configured yet — leaderboard is local-only for this session.");
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Load whatever the current global best is on page load
      client.from("leaderboard").select("*").eq("id", 1).single()
        .then(({ data, error }) => {
          if (error) throw error;
          if (data && data.rank_index > bestIndex) {
            showBest(data.rank_index, data.name, data.color);
          }
        })
        .catch((err) => console.warn("Could not load leaderboard:", err));

      // Live updates when any other visitor sets a new best
      client
        .channel("leaderboard-changes")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "leaderboard" }, (payload) => {
          const row = payload.new;
          if (row && row.rank_index > bestIndex) {
            showBest(row.rank_index, row.name, row.color);
          }
        })
        .subscribe();

      // Exposed so pull() can call it without depending on this block existing
      window.reportBestToLeaderboard = async (item, index) => {
        try {
          const { data } = await client.from("leaderboard").select("rank_index").eq("id", 1).single();
          if (!data || index > data.rank_index) {
            await client.from("leaderboard")
              .update({ rank_index: index, name: item.name, color: item.color })
              .eq("id", 1);
          }
        } catch (err) {
          console.warn("Could not write to leaderboard:", err);
        }
      };
    } catch (err) {
      console.warn("Leaderboard setup failed — falling back to local-only:", err);
    }
  })();
</script>

</body>
</html>
